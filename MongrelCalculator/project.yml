name: MongrelCalculator
options:
  bundleIdPrefix: com.mongrel
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
targets:
  MongrelCalculator:
    type: application
    platform: macOS
    sources: [{path: MongrelCalculator, type: group}]
    info:
      path: MongrelCalculator/App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "© 2026 Mongrel"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mongrel.calculator
        PRODUCT_NAME: MongrelCalculator
        SWIFT_VERSION: 5.9
        MACOSX_DEPLOYMENT_TARGET: 14.0
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_STRICT_CONCURRENCY: complete

  MongrelCalculatorTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests
    dependencies:
      - target: MongrelCalculator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mongrel.calculator.tests
        SWIFT_VERSION: 5.9

schemes:
  MongrelCalculator:
    build:
      targets:
        MongrelCalculator: all
    test:
      gatherCoverageData: false
      targets:
        - MongrelCalculatorTests
